# pyproject.toml

[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evita"
version = "0.1.0"
description = "An application to test autonomous vehicle interactions using simulations."
readme = "README.md"
authors = [{ name = "Anonymous" }]
dependencies = [
    "click >= 8.1.3",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["evita*"]
exclude = ["base_scenarios*", "docs*", "tests*"]

[project.scripts]
evita = "evita.__main__:cli"